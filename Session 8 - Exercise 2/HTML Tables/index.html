<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
    <style>
        .table-main{
            border: 1px solid #000;
        }
        .table-header{
            background-color: orange;
        }
        .table-body{
            background-color: lime;
        }
        .table-footer{
            background-color: aqua;
        }
        .failed-student{
            background-color: red;
        }
        .failed-student-name{
            color: yellow;
        }
    </style>
</head>
<body>
    <table cellpadding="5" class="table-main" border="2" align="left">
        <caption>Students Scores List</caption>
        <thead class="table-header">
            <tr>
                <th>Index</th>
                <th>ST. Name</th>
                <th>ST. Score</th>
            </tr>
        </thead>
        <tbody class="table-body">
            <tr>
                <td>1</td>
                <td>Alex</td>
                <td>18.5</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Martin</td>
                <td>19</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Max</td>
                <td>20</td>
            </tr>
            <tr class="failed-student">
                <td>4</td>
                <td class="failed-student-name">Jessie</td>
                <td>12</td>
            </tr>
            <tr>
                <td>5</td>
                <td>John</td>
                <td>16</td>
            </tr>
            <tr>
                <td>6</td>
                <td colspan="2">No Score Person</td>
            </tr>
            <tr>
                <td rowspan="2">7</td>
                <td>Mark</td>
                <td>16</td>
            </tr>
            <tr>
                <td>Mark</td>
                <td>16.5</td>
            </tr>
        </tbody>
        <tfoot class="table-footer">
            <tr>
                <td colspan="3" style="text-align: center;">Finish the table</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
